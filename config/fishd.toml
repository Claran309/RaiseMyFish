# 路径相对启动工作目录。敏感值只写环境变量名。
[db]
dsn_env = "FISH_DB_DSN"
timeout_seconds = 5

[log]
level = "info"
dir = "logs"

[runtime]
state_file = "data/fishd-status.json"
heartbeat_seconds = 5
stale_seconds = 20

# 常驻点赞：fishd 在线时每隔 N 秒给当前直播间点一次赞（复用直播采集的凭据）。
# 0=关闭；开启时 10-600 秒。无凭据或凭据缺 bili_jct 时自动跳过，不影响采集/消费。
[presence]
heartbeat_like_seconds = 0

# live仅采集到Bus；0.11冒烟临时开启（30分钟）
[channels.live]
enabled = true
[channels.comment]
enabled = false
[channels.dm]
enabled = false
[channels.qq]
enabled = false

# 启用live前需明确房间与自身UID；Cookie仅从环境或显式文件读取。
[collector.live]
room_id = "30308220"
self_id = "3747574135655903"
node_path = "node"
script_path = "tools/bili-whale/danmaku-await.mjs"
http_timeout_ms = 10000
connect_timeout_ms = 10000
heartbeat_ms = 30000
idle_ms = 90000
startup_ms = 45000
backoff_min_ms = 1000
backoff_max_ms = 60000
stable_after_ms = 30000
max_failures = 8

# 弹幕发送通道：与采集脚本分开——采集是 danmaku-await.mjs（长连监听），
# 发送是 danmaku.mjs（一次性 POST）。凭据复用 [collector.live] 解析到的 FISH_BILI_COOKIE（同一账号）。
[sender]
node_path = "node"
script_path = "tools/bili-whale/danmaku.mjs"
self_id = "3747574135655903"
http_timeout_ms = 35000

# 只装配Brain与无调用诊断；通道仍必须关闭。
[llm]
enabled = true
persona_dir = "personas/dafeiyu"
# 现人格 soul+live 场景约 8KB，已接近契约默认 8192；再叠加 Presence 状态行会触发 budget 错误。
# 这里是 prompt 估算上限，不是输入校验放宽；生产留出状态行与部分 samples/rules 的余量。
max_prompt_tokens = 16384
max_reply_tokens = 128
attempt_timeout_ms = 10000
total_timeout_ms = 40000
backoff_ms = 250
max_concurrent = 4
temperature = 0.7

[llm.providers.deepseek]
type = "openai"
base_url = "https://api.deepseek.com/v1"
api_key_env = "FISH_LLM_KEY"
models = ["deepseek-chat"]

[llm.routing]
default = "deepseek:deepseek-chat"
live = "deepseek:deepseek-chat"

# 报价可省略（费用存NULL）；如配置需同时给两项，按具体model定价。
# 下面0仅演示明确免费场景，不是DeepSeek报价；不确定真实价格就保留注释。
# [llm.providers.deepseek.prices.deepseek-chat]
# input_usd_per_million = 0.0
# output_usd_per_million = 0.0

# 仅装配知识Reader；默认关闭，事件消费链路尚未接入。
[knowledge]
enabled = true
dir = "personas/dafeiyu/knowledge"
budget_percent = 10
# 梗白学习：从最近 24h 公开弹幕里发现知识库未收录的重复短语，
# 交给 LLM 判断是否值得收录，结果追加到 memes/learned.md。
# 默认关闭；启用需同时启用 [llm]。每日上限按 UTC 自然日计，持久化在条目 ID 前缀。
meme_learn = false
meme_learn_max_per_day = 10

# 联网搜索（ReAct 的 web_search 工具）：留空表示未配置，工具明确回「未配置搜索源」。
# 协议：POST {"query": "..."} → {"results": [{"title","snippet","url"}]}，
# 可接 Serper/Bing/自建服务；search_key 可选，作为 Authorization: Bearer。
# 地址只允许 HTTPS 或本机 HTTP（localhost/127.0.0.1）。
# 注意：本文件会被提交，真实密钥不要写在这里。
[web]
search_url = ""
search_key = ""

# ReAct 思考链（C 档）：两段式判断为「要查事实」时才走多步，
# 简单弹幕仍单步生成（延迟维持 1 秒级）。
# 预算纪律：步数 3、总超时 8 秒；步数/超时/解析失败一律降级，不拖成半分钟。
# 只有 [llm] enabled 且路由存在时才会真正装配。
[reasoning]
enabled = true
max_steps = 3
timeout_ms = 8000
# 副作用工具（送礼/关注/点赞/私信/发动态）总开关：默认关，开了模型才看得见这些工具。
allow_side_effect_tools = false

# 看直播（0.12 MVP）：录一段 → 抽帧 → 视觉描述 + ASR 转写；默认关闭。
# 启用需同时启用 [llm]，并从 cookie_env 指向的环境变量读取 B站凭据。
[watch]
enabled = false
# 状态注入：告诉 Brain 此刻在看谁的直播；Presence 有 watching 时以实时房间为准。
current_room = "30308220" # 当前观看的直播间；留空则不注入配置兜底
streamer_name = "Claran309" # 主播名；留空则只报房间号
source = "stream"
interval_seconds = 600 # 直播采集运行期间，每隔多少秒看一次
seconds = 10
frames = 4
asr_url = "http://127.0.0.1:8077/v1/audio/transcriptions"
stream_quality = "origin" # origin/bluray/ultra/high/smooth
cookie_env = "FISH_BILI_COOKIE"
ffmpeg_path = "ffmpeg"
ffprobe_path = "ffprobe"
temp_dir = "" # 留空使用系统临时目录
llm_route = "default"

# 主动发弹幕（0.17）：默认关闭。开启后每隔 interval_seconds 截 1 帧，
# 画面变化不足 min_change_percent 就跳过，交给视觉模型生成 ≤15 字观众弹幕，
# 去重 + max_per_hour 限流后经 [sender] 发送，并写 DirOut 事件记账。
# 复用 [watch] 的流清晰度/ffmpeg/凭据配置；需要同时开启 live 采集与 [llm]。
[proactive]
# 0.19 重构：取消 max_per_hour 固定窗口与像素变化检测，频率只看 send_gap。
# 链路：gap 检查 → 截帧 → 详细识图 → 注入 Visual 走 Brain 管线 → 清洗/15字/去重 → 发送
enabled = true
interval_seconds = 20
send_gap_seconds = 30 # 两次主动发送的最小间隔；间隔内跳过（reason=gap）
# 画面里出现「要查事实」的线索时先走 ReAct 多步查证，否则单步；false 则永远单步。
use_react = true
# ReAct 触发：always（默认，有画面描述就查）/ keyword（回到静态词表）
react_trigger = "always"

# 送礼（0.13b）：默认关闭且默认 dry-run——不读凭据、不调用平台API、不扣电池。
# 只有 enabled=true 且 real=true 才会真实赠送；凭据只从 FISH_BILI_COOKIE/_FILE 读取。
# daily_limit 按礼物数量计（不是次数），跨本地自然日重置；真实送礼要求 num <= daily_limit。
# max_price/max_num 是 Go 与 Node 双重执行的限制；allowed_rooms 为空表示不限制房间。
[gift]
enabled = true # 娇娇直播间测试：真实送礼（每15分钟1朵小花花）
real = true
gift_id = "31036" # 小花花：直购礼物，price=100（1电池）
num = 1
daily_limit = 100 # 测试期放宽（每15分钟1朵≈4朵/小时）
max_price = 100 # price 单位，100=1电池；范围1-10000
max_num = 10 # 单次数量上限；范围1-100，不能小于 num
allowed_rooms = ["1992099976"] # 娇娇直播间
node_path = "node"
script_path = "tools/bili-whale/gift.mjs"
timeout_ms = 30000

# 记忆提炼（0.5 补丁）：默认开启，水位固定写入 state/memory-watermark.json。
# worker 初始化失败只记日志并降级，不阻塞采集/消费；allow_private=false 时私密事件不提炼。
[memory]
enabled = true
interval_seconds = 300
allow_private = false
# LLM 语义提炼：只对「@鱼/长文本/强互动」跑模型，其余走规则版；超限流回落规则。
llm_extract = true
llm_extract_max_per_hour = 30

# 消费循环（Claim → Scheduler → Brain → Sender）。
# 整段缺失表示「只采集不回复」；这里保留默认值，实际是否回复还取决于 [llm] enabled 与路由。
[scheduler]
max_concurrent = 4
max_pending = 64
claim_batch = 8
poll_interval_ms = 500
retry_delay_ms = 5000
operation_timeout_ms = 10000
worker_timeout_ms = 30000

[scheduler.channels.live]
brain = "default"
rate_per_minute = 6
burst = 2
daily_quota = 200
cooldown_ms = 10000
min_runes = 2
# 只回复 @ 鱼的弹幕；未 @ 的在 schedule 阶段直接 skipped，不调 LLM。
# B站回复/@弹幕正文可能没有 @，采集器会把 reply_mid/reply_uname 写入事件 Meta，
# 这里用 self_ids（最可靠，不受改名影响）与 self_names 共同匹配。
reply_only_mention = true
# 被结构化 @（回复目标是自己）时，回复前缀带「@对方昵称 」；正文含前缀截到 40 rune。
reply_mention_back = true
max_reply_runes = 40
self_names = ["大肥鱼", "Claranの大肥鱼"]
self_ids = ["3747574135655903"]

# 观众档案（认人）：从 events 聚合「谁说过什么/鱼怎么回」，按 from_id 注入 prompt。
# 只给 hits ≥ min_hits 的人建档；每小时节流重建，且只在直播活跃时跑。
[viewer]
enabled = true
min_hits = 2
recent_texts = 15
recent_replies = 10
rebuild_interval_seconds = 3600
