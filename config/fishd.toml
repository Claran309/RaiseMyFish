# 路径相对启动工作目录。敏感值只写环境变量名。
[db]
dsn_env = "FISH_DB_DSN"
timeout_seconds = 5

[log]
level = "info"
dir = "logs"

[runtime]
state_file = "data/fishd-status.json"
heartbeat_seconds = 5
stale_seconds = 20

# 常驻点赞：fishd 在线时每隔 N 秒给当前直播间点一次赞（复用直播采集的凭据）。
# 0=关闭；开启时 10-600 秒。无凭据或凭据缺 bili_jct 时自动跳过，不影响采集/消费。
[presence]
heartbeat_like_seconds = 0

# live仅采集到Bus；0.11冒烟临时开启（30分钟）
[channels.live]
enabled = true
[channels.comment]
enabled = false
[channels.dm]
enabled = true
[channels.qq]
enabled = false

# 启用live前需明确房间与自身UID；Cookie仅从环境或显式文件读取。
[collector.live]
room_id = "30308220"
self_id = "3747574135655903"
node_path = "node"
script_path = "tools/bili-whale/danmaku-await.mjs"
http_timeout_ms = 10000
connect_timeout_ms = 10000
heartbeat_ms = 30000
idle_ms = 90000
startup_ms = 45000
backoff_min_ms = 1000
backoff_max_ms = 60000
stable_after_ms = 30000
max_failures = 8

# 评论采集（P1）：轮询自己账号的视频/动态评论区（最新回复优先），
# 按 rpid 去重后写 channel=comment 事件。
# 默认关闭；启用需要 [channels.comment] enabled=true、FISH_BILI_COOKIE/_FILE 凭据，
# 以及本账号 UID（[sender].self_id 或 [collector.live].self_id）用于跳过自己发的评论。
# auto_discover=true 时按 discover_interval_seconds 刷新自己账号的视频+动态列表；
# videos 是手动追加的固定 oid（可为空）；发现失败只退回手动列表，不报错。
# interval_seconds 范围 10-3600；discover_interval_seconds 范围 60-86400。
[collector.comment]
enabled = false
auto_discover = true
videos = []
interval_seconds = 60
discover_interval_seconds = 600

# 弹幕发送通道：与采集脚本分开——采集是 danmaku-await.mjs（长连监听），
# 发送是 danmaku.mjs（一次性 POST）。凭据复用 [collector.live] 解析到的 FISH_BILI_COOKIE（同一账号）。
[sender]
node_path = "node"
script_path = "tools/bili-whale/danmaku.mjs"
self_id = "3747574135655903"
http_timeout_ms = 35000

# 评论回复发送（P1）：独立开关，默认关闭。
# 不主动限速，由队列按到达顺序处理；只有平台返回限流/频繁（412/429/「操作太快」）
# 才退避重试（30 秒起指数翻倍）。凭据与 csrf（bili_jct）复用同一账号 Cookie。
[sender.comment]
enabled = false

# 只装配Brain与无调用诊断；通道仍必须关闭。
[llm]
enabled = true
persona_dir = "personas/dafeiyu"
# 现人格 soul+live 场景约 8KB，已接近契约默认 8192；再叠加 Presence 状态行会触发 budget 错误。
# 这里是 prompt 估算上限，不是输入校验放宽；生产留出状态行与部分 samples/rules 的余量。
max_prompt_tokens = 16384
max_reply_tokens = 128
attempt_timeout_ms = 10000
total_timeout_ms = 40000
backoff_ms = 250
max_concurrent = 4
temperature = 0.7

[llm.providers.deepseek]
type = "openai"
base_url = "https://api.deepseek.com/v1"
api_key_env = "FISH_LLM_KEY"
models = ["deepseek-chat"]

[llm.routing]
default = "deepseek:deepseek-chat"
live = "deepseek:deepseek-chat"

# 报价可省略（费用存NULL）；如配置需同时给两项，按具体model定价。
# 下面0仅演示明确免费场景，不是DeepSeek报价；不确定真实价格就保留注释。
# [llm.providers.deepseek.prices.deepseek-chat]
# input_usd_per_million = 0.0
# output_usd_per_million = 0.0

# 仅装配知识Reader；默认关闭，事件消费链路尚未接入。
[knowledge]
enabled = true
dir = "personas/dafeiyu/knowledge"
budget_percent = 10
# 梗白学习：从最近 24h 公开弹幕里发现知识库未收录的重复短语，
# 交给 LLM 判断是否值得收录，结果追加到 memes/learned.md。
# 默认关闭；启用需同时启用 [llm]。
# 候选按弹幕出现次数从高到低取 Top15（meme_learn_hot_limit）。
# 每日上限按 UTC 自然日计，持久化在条目 ID 前缀；0=不限（默认）。
meme_learn = true
meme_learn_hot_limit = 15
meme_learn_max_per_day = 0

# 知识语义检索（K2）：向量由智谱 embedding-3 生成，存 pgvector。
# 密钥只从 key_env 指向的环境变量（或本地 .env）读取，禁止写在本文件。
# dimension 必须为 1024，与 migrations/0006 的 vector(1024) 对齐。
# auto_refresh 开启后 fishd 按间隔检查知识库 revision，变化时增量 embedding；
# CLI 手动入库：fishctl knowledge embed（只算新增/变更条目）。
[embedding]
enabled = true
url = "https://open.bigmodel.cn/api/paas/v4/embeddings"
model = "embedding-3"
key_env = "FISH_EMBEDDING_KEY"
dimension = 1024
batch_size = 32
# 混合召回 score = 关键词档位 + alpha * 语义相似度（0~1）。
alpha = 0.5
# 语义召回的最低相关性：低于它的向量命中直接丢弃（允许 0 条结果）。
# 「最相近」不等于「相关」——随机人名/无关歌词不能被当成知识或记忆。
# 该阈值需要按真实负例校准：不同 embedding 模型的相似度分布不同。
min_similarity = 0.6
# auto_refresh 是「知识库 + 记忆/档案向量」的定时增量总开关：
# 知识库按 revision 变化触发，记忆/档案按 memory_refresh_interval_seconds 轮询。
# 关掉后只能手工跑 fishctl knowledge embed / fishctl memory embed / fishctl viewer embed。
# 开启需同时 enabled = true；首次开启会立刻补一轮全量增量（有 embedding 费用）。
auto_refresh = true
refresh_interval_seconds = 3600
# 记忆/观众档案向量的增量刷新间隔（60-86400 秒，默认 300）：
# 只重算 embedding 为空或内容 hash 变化过的行，内容没变不重复调用模型。
memory_refresh_interval_seconds = 300
# 私密记忆外发授权（默认 false）：
# 开启等于允许把 private 记忆的摘要发送给上面配置的 url/model 提供方。
# 关闭时私密行不参与向量化（也就不会被语义召回命中）；归档/失效/未生效记录
# 在任何情况下都不会外发。改动只影响后续增量，已入库的旧向量不会自动清除。
memory_allow_private = false

# 联网搜索（ReAct 的 web_search 工具）：留空表示未配置，工具明确回「未配置搜索源」。
# 协议：POST {"query": "..."} → {"results": [{"title","snippet","url"}]}，
# 可接 Serper/Bing/自建服务；search_key 可选，作为 Authorization: Bearer。
# 地址只允许 HTTPS 或本机 HTTP（localhost/127.0.0.1）。
# 注意：本文件会被提交，真实密钥不要写在这里。
[web]
# 运维面板：开启；只允许监听回环地址（127.0.0.1 / ::1 / localhost）
enabled = true
addr = "127.0.0.1:8090"
search_url = ""
# 搜索协议：generic（默认，POST {"query"}）/ serper（X-API-KEY）/ bing（Ocp-Apim-Subscription-Key）。
protocol = "generic"
# 结果 URL 域名白名单：留空不限；填写后只保留域名相同或子域的结果。
# 例：allowed_domains = ["bilibili.com", "zhihu.com"]
allowed_domains = []
search_key = ""
# 推荐用环境变量（优先于 search_key 字面值；来源与主加载器一致：进程环境 > 本地 .env）：
# search_key_env = "FISH_SEARCH_KEY"
search_key_env = ""

# MCP 工具服务器（stdio JSON-RPC 2.0）：默认关闭，供外部 agent（Codex/Claude）调用 ReAct 工具。
# 启动：go run ./cmd/fishmcp --config config/fishd.toml
# 工具白名单为空表示暴露全部已注册工具；副作用工具仍受 [reasoning] allow_side_effect_tools 控制。
[mcp]
enabled = false
# 例：allowed_tools = ["memory_search", "knowledge_search", "now", "web_search"]
allowed_tools = []

# ReAct 思考链（C 档）：默认全部弹幕走多步（可用性优先），
# 只有短句（少于 6 个字符，如「哈哈」「在吗」）保持单步。
# 预算纪律：步数 3、总超时 8 秒；步数/超时/解析失败一律降级，不拖成半分钟。
# 只有 [llm] enabled 且路由存在时才会真正装配。
[reasoning]
enabled = true
# true：除短句外全部走 ReAct；false：回到旧两段式（命中召回词表才走）。
default_react = true
max_steps = 3
timeout_ms = 8000
# 副作用工具（送礼/关注/点赞/私信/发动态）总开关：默认关，开了模型才看得见这些工具。
allow_side_effect_tools = false

# 看直播（0.12 MVP）：录一段 → 抽帧 → 视觉描述 + ASR 转写；默认关闭。
# 启用需同时启用 [llm]，并从 cookie_env 指向的环境变量读取 B站凭据。
[watch]
enabled = false
# 状态注入：告诉 Brain 此刻在看谁的直播；Presence 有 watching 时以实时房间为准。
current_room = "30308220" # 当前观看的直播间；留空则不注入配置兜底
streamer_name = "Claran309" # 主播名；留空则只报房间号
source = "stream"
interval_seconds = 600 # 直播采集运行期间，每隔多少秒看一次
seconds = 10
frames = 4
asr_url = "http://127.0.0.1:8077/v1/audio/transcriptions"
stream_quality = "origin" # origin/bluray/ultra/high/smooth
cookie_env = "FISH_BILI_COOKIE"
ffmpeg_path = "ffmpeg"
ffprobe_path = "ffprobe"
temp_dir = "" # 留空使用系统临时目录
llm_route = "default"

# 主动发弹幕（0.17）：默认关闭。开启后每隔 interval_seconds 截 1 帧，
# 画面变化不足 min_change_percent 就跳过，交给视觉模型生成 ≤15 字观众弹幕，
# 去重 + max_per_hour 限流后经 [sender] 发送，并写 DirOut 事件记账。
# 复用 [watch] 的流清晰度/ffmpeg/凭据配置；需要同时开启 live 采集与 [llm]。
[proactive]
# 频率只看 send_gap；取消 max_per_hour 固定窗口与像素变化检测。
# 链路：gap → 截帧 → 识图 → 追问/纠正让路 → 画面/对话新颖性 → Brain
#      → 四态（comment/ask/react/stay_silent）→ 语义去重 → 发送。
# 画面与用户对话都没变化时保持安静；发送失败不算“已经说过”。
enabled = true
interval_seconds = 20
send_gap_seconds = 30 # 两次主动发送的最小间隔；间隔内跳过（reason=gap）
# 画面里出现「要查事实」的线索时先走 ReAct 多步查证，否则单步；false 则永远单步。
use_react = true
# ReAct 触发：always（默认，有画面描述就查）/ keyword（回到静态词表）
react_trigger = "always"

# 送礼（0.13b）：默认关闭且默认 dry-run——不读凭据、不调用平台API、不扣电池。
# 只有 enabled=true 且 real=true 才会真实赠送；凭据只从 FISH_BILI_COOKIE/_FILE 读取。
# daily_limit 按礼物数量计（不是次数），跨本地自然日重置；真实送礼要求 num <= daily_limit。
# max_price/max_num 是 Go 与 Node 双重执行的限制；allowed_rooms 为空表示不限制房间。
[gift]
enabled = true # 娇娇直播间测试：真实送礼（每15分钟1朵小花花）
real = true
gift_id = "31036" # 小花花：直购礼物，price=100（1电池）
num = 1
daily_limit = 100 # 测试期放宽（每15分钟1朵≈4朵/小时）
max_price = 100 # price 单位，100=1电池；范围1-10000
max_num = 10 # 单次数量上限；范围1-100，不能小于 num
allowed_rooms = ["1992099976"] # 娇娇直播间
node_path = "node"
script_path = "tools/bili-whale/gift.mjs"
timeout_ms = 30000

# 记忆提炼（0.5 补丁）：默认开启，水位固定写入 state/memory-watermark.json。
# worker 初始化失败只记日志并降级，不阻塞采集/消费；allow_private=false 时私密事件不提炼。
[memory]
enabled = true
interval_seconds = 300
allow_private = false
# 冻结开关：true 时提炼 worker 只读不写（不落记忆、不推进水位）。
# 运行时可改状态文件 state/memory.frozen（fishctl memory freeze/unfreeze），无需重启；
# 此处为 true 时优先级更高，删除状态文件也不会解冻。
frozen = false
# LLM 语义提炼：只对「@鱼/长文本/强互动」跑模型，其余走规则版；超限流回落规则。
llm_extract = true
llm_extract_max_per_hour = 30
# 灵魂记忆（长期设定）：每小时从高重要度 fact/preference 重建 soul-memories.md
soul_enabled = true
soul_max_entries = 20
# 留空表示跟随 [llm] persona_dir：<persona_dir>/knowledge/soul-memories.md，
# 多 persona 各用各的；显式填写则优先。
soul_path = ""
# 主人可信 UID：只有发言人 UID 与之相等才算主人自述，才可能提升为长期设定。
# 观众转述「主人是…」只保留为带来源的记忆候选，不进入全局设定。
# 昵称可被改名冒充，owner_name 仅用于 LLM 提炼的语义提示。
owner_uid = "313591854"
owner_name = "Claran309"
# 观众侧写定时任务：默认每小时对近期活跃观众做一次 LLM 侧写（性格/偏好/口头禅/关系/最近话题），
# 写入 viewer_profiles.profile_summary + memory_records + viewers.md 公开知识条目。
# 只读公开非 DM 弹幕；模型失败时回落到统计聚合（旧家效果）。0 表示关闭。
viewer_summary_interval_seconds = 3600

# 消费循环（Claim → Scheduler → Brain → Sender）。
# 整段缺失表示「只采集不回复」；这里保留默认值，实际是否回复还取决于 [llm] enabled 与路由。
[scheduler]
max_concurrent = 4
max_pending = 64
claim_batch = 8
poll_interval_ms = 500
retry_delay_ms = 5000
operation_timeout_ms = 10000
worker_timeout_ms = 30000

[scheduler.channels.live]
brain = "default"
rate_per_minute = 6
burst = 2
daily_quota = 200
cooldown_ms = 10000
min_runes = 2
# 只回复 @ 鱼的弹幕；未 @ 的在 schedule 阶段直接 skipped，不调 LLM。
# B站回复/@弹幕正文可能没有 @，采集器会把 reply_mid/reply_uname 写入事件 Meta，
# 这里用 self_ids（最可靠，不受改名影响）与 self_names 共同匹配。
reply_only_mention = true
# 被结构化 @（回复目标是自己）时，回复前缀带「@对方昵称 」；正文含前缀截到 40 rune。
reply_mention_back = true
max_reply_runes = 40
self_names = ["大肥鱼", "Claranの大肥鱼", "魔鱼魔鱼吃白饭饭饭饭"]
self_ids = ["3747574135655903"]

# 评论回复的调度策略：启用 [collector.comment]/[sender.comment] 时必须同时配置，
# 否则调度器不认识 comment 通道，评论事件只会排队不被消费。
# 不限频：高配额 + 0 冷却，实际发送顺序由 events 到达顺序决定；
# 被动保护（平台限流退避）在 sender 层完成，不靠调度器限速。
[scheduler.channels.comment]
brain = "default"
rate_per_minute = 120
burst = 20
daily_quota = 10000
cooldown_ms = 0
min_runes = 2
max_reply_runes = 40

# 私信回复的调度策略：与评论相同的高配额、0 冷却；私密语义由调度器按通道类型加 ACL。
[scheduler.channels.dm]
brain = "default"
rate_per_minute = 120
burst = 20
daily_quota = 10000
cooldown_ms = 0
min_runes = 1
max_reply_runes = 40

# 观众档案（认人）：从 events 聚合「谁说过什么/鱼怎么回」，按 from_id 注入 prompt。
# 只给 hits ≥ min_hits 的人建档；每小时节流重建，且只在直播活跃时跑。
[viewer]
enabled = true
min_hits = 2
recent_texts = 15
recent_replies = 10
rebuild_interval_seconds = 3600
# 人工维护的观众别名/同音组（YAML）；文件一改，下次查询即生效，无需重启。
# 只有 status=confirmed 的条目参与认人；格式见 docs/viewer-aliases.md。
alias_file = "personas/dafeiyu/viewer_aliases.yaml"

# 私信通道（P1）：采集所有会话，不按白名单过滤；
# 轮询私信会话 → 按 msg_id 去重 → 写事件（channel=dm、session=对方 mid）
[collector.dm]
enabled = true
interval_seconds = 120   # 10-3600
# 私信采集水位（账号+会话+消息游标，跨重启保留）；留空用 state/dm-cursors.json
state_path = "state/dm-cursors.json"

# 发送：all_followers=true（默认）所有发信人都可回，不再要求互关/白名单/每日一个收信人；
# allowed_mids 仅作额外放行（并始终并入主人 mid），不构成限制。
[sender.dm]
enabled = true
all_followers = true
allowed_mids = ["313591854"]
# 仅显式 all_followers=false 时启用的旧护栏状态（跨重启保留）
state_path = "state/dm-recipient.json"

# 看门狗（独立进程 cmd/fishwatchdog）：读心跳判活，冻结/死亡时重启 fishd。
[watchdog]
enabled = true
interval_seconds = 60        # 检查间隔
stale_seconds = 120          # 心跳超过这个时间没更新 → 冻结
unhealthy_threshold = 2      # 连续异常多少次才重启
cooldown_seconds = 300       # 重启后冷却，防风暴
restart_command = "bin/fishd.exe --env-file .env"
# service-command：restart_command 是短命管理命令（systemctl/脚本），超时未退出即失败；
# managed-child：restart_command 直接拉起常驻 fishd，必须等到该子进程写出的新心跳。
restart_mode = "managed-child"
heartbeat_path = "state/fishd.heartbeat"
