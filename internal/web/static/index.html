<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>概览 · 大肥鱼面板</title>
<style>
:root{--bg:#0f1115;--fg:#e6e6e6;--muted:#8b93a1;--card:#171a21;--line:#232833;--accent:#4ea1ff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:15px}
nav a{color:var(--muted);text-decoration:none;margin-right:14px}
nav a.on{color:var(--accent)}
main{padding:20px;max-width:1080px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.card .k{color:var(--muted);font-size:12px}
.card .v{font-size:22px;margin-top:4px;word-break:break-all}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
input,select,button{background:#12151c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}
button.danger{color:var(--bad);border-color:#3a2a2a}
.bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.muted{color:var(--muted)}
.tag{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <b>🐟 大肥鱼面板</b>
  <nav><a class="on" href="/">概览</a><a href="/memory">记忆</a><a href="/activity">活动</a></nav>
</header>
<main>
  <div class="bar"><button onclick="load()">刷新</button><span class="muted" id="ts"></span></div>
  <div class="grid" id="cards"></div>
</main>
<script>
function fmt(k, v) {
  return '<div class="card"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
}
async function load() {
  var r = await fetch('/api/status');
  if (!r.ok) { document.getElementById('cards').innerHTML = '<div class="card">加载失败</div>'; return; }
  var d = await r.json();
  var kinds = Object.keys(d.memory_by_kind || {}).map(function (k) {
    return k + ':' + d.memory_by_kind[k];
  }).join(' / ') || '—';
  document.getElementById('cards').innerHTML = [
    fmt('事件总数', d.events_total),
    fmt('待处理', d.events_pending),
    fmt('记忆条数', d.memory_total),
    fmt('记忆分类', kinds),
    fmt('发送总数', d.send_total),
    fmt('发送失败', d.send_failed),
    fmt('累计费用($)', (d.cost_usd || 0).toFixed(4))
  ].join('');
  document.getElementById('ts').textContent = '更新于 ' + d.generated_at;
}
load();
setInterval(load, 15000);
</script>
</body>
</html>
