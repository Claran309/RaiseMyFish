<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="panel-token" content="__PANEL_TOKEN__">
<title>概览 · 大肥鱼面板</title>
<style>
:root{
  --bg:#0f1115;--fg:#e6e6e6;--muted:#8b93a1;--card:#171a21;--line:#232833;
  --accent:#4ea1ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:15px}
nav a{color:var(--muted);text-decoration:none;margin-right:14px}
nav a.on{color:var(--accent)}
.spacer{flex:1}
.pill{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:#1d3a26;background:#0f1a12}
.pill.bad{color:var(--bad);border-color:#3a1d1d;background:#1a0f0f}
main{padding:20px;max-width:1180px;margin:0 auto}
.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
h2{font-size:13px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:18px 0 10px}
h2:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 16px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.card.ok::before{background:var(--ok)}.card.bad::before{background:var(--bad)}
.card.warn::before{background:var(--warn)}.card.info::before{background:var(--accent)}
.card .k{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.card .v{font-size:21px;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-all}
.card .v.small{font-size:13px;line-height:1.5}
.card .sub{font-size:11px;color:var(--muted);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden}
.panel .head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.panel .head b{color:var(--fg);font-weight:600;font-size:13px}
.row{display:flex;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.row:last-child{border-bottom:0}
.row .t{color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .who{color:var(--accent);white-space:nowrap}
.row .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.err{background:#160e0e}
.row .st{font-size:11px;padding:0 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.row .st.dead{color:var(--bad);border-color:#3a1d1d}
.row .st.retry{color:var(--warn);border-color:#3a331d}
.empty{padding:14px;color:var(--muted);font-size:13px}
button{background:#12151c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer}
textarea,select{background:#12151c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
textarea{width:100%;resize:vertical}
.inj-bar{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.inj-group,.err-group{font-size:11px;color:var(--muted);letter-spacing:.04em}
.inj-group{padding:8px 0 2px;border-top:1px dashed var(--line);margin-top:6px}
.inj-group:first-child{border-top:0;margin-top:0;padding-top:2px}
.err-group{padding:6px 14px;background:#12151c;border-bottom:1px solid var(--line)}
.err-group .muted{letter-spacing:0}
.inj-item{padding:8px 0;border-bottom:1px solid var(--line)}
.inj-item:last-child{border-bottom:0}
.inj-item .txt{white-space:pre-wrap;word-break:break-word}
.inj-item .meta{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
.tag{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <b>🐟 大肥鱼面板</b>
  <nav><a class="on" href="/">概览</a><a href="/live">直播</a><a href="/message">消息</a><a href="/activity">活动</a><a href="/config">配置</a><a href="/logs">日志</a><a href="/diary">日报</a><a href="/memory">记忆</a><a href="/knowledge">知识</a><a href="/accounts">账号</a></nav>
  <span class="spacer"></span>
  <span class="pill" id="health">检测中…</span>
  <button onclick="load()">刷新</button>
</header>
<main>
  <div class="cols">
    <section>
      <h2>运行状态</h2>
      <div class="grid" id="run-cards"></div>

      <h2>数据统计</h2>
      <div class="grid" id="data-cards"></div>

      <h2>操作人注入</h2>
      <div class="panel">
        <div class="head">📝 <b>临时设定</b><span class="spacer"></span><span class="tag" id="inj-count"></span></div>
        <div style="padding:10px 14px">
          <textarea id="inj-content" rows="3" maxlength="500" placeholder="例如：加个设定：你其实是一只猫，说话要偶尔喵一下"></textarea>
          <div class="tag" style="margin-top:4px">临时注入会进入下一轮回复的上下文，不写入长期记忆；保存后立即生效。</div>
          <div class="inj-bar">
            <select id="inj-ttl">
              <option value="3600">1 小时</option>
              <option value="21600">6 小时</option>
              <option value="86400">24 小时</option>
              <option value="0">永久</option>
            </select>
            <button id="inj-submit" onclick="injectSubmit()">注入</button>
            <button id="inj-cancel" onclick="injectReset()" style="display:none">取消编辑</button>
            <span class="tag" id="inj-msg"></span>
          </div>
          <div id="inj-list"></div>
        </div>
      </div>

      <h2>向量入库</h2>
      <div class="grid" id="embed-cards"></div>
    </section>

    <section>
      <h2>最近动态</h2>
      <div class="panel">
        <div class="head">📥 <b>最近事件</b><span class="spacer"></span><span class="tag" id="ev-count"></span></div>
        <div id="events"></div>
      </div>
      <div class="panel" style="margin-top:12px">
        <div class="head">⚠️ <b>最近错误</b><span class="spacer"></span>
          <button id="err-clear-old" onclick="clearOldErrors()" title="只清理面板列表，不改事件状态">清理7天前</button>
          <span class="tag" id="err-count"></span></div>
        <div id="errors"></div>
      </div>
    </section>
  </div>
</main>
<script>
// 写接口要带面板令牌（O04）：页面 HTML 由服务端注入，跨站页面读不到它。
function panelToken() {
  var m = document.querySelector('meta[name="panel-token"]');
  return m ? m.content : '';
}
function esc(s) {
  return (s || '').replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function card(kind, icon, label, value, sub, small) {
  return '<div class="card ' + kind + '"><div class="k">' + icon + ' ' + label + '</div>' +
    '<div class="v' + (small ? ' small' : '') + '">' + value + '</div>' +
    (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>';
}
function hhmmss(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return esc(iso);
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}
function when(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime()) || d.getFullYear() < 2000) return '—';
  return d.toLocaleString('zh-CN', { hour12: false });
}
async function loadEmbeddingStatus() {
  var box = document.getElementById('embed-cards');
  var r = await fetch('/api/embedding/status');
  if (!r.ok) { box.innerHTML = '<div class="card bad">向量状态加载失败</div>'; return; }
  var d = await r.json();
  function one(icon, label, s) {
    var total = Number(s.total) || 0, embedded = Number(s.embedded) || 0, pending = Number(s.pending) || 0;
    var p = total > 0 ? Math.min(100, Math.round(embedded * 100 / total)) : 0;
    var sub = '待嵌入 ' + pending + ' · 最后同步 ' + when(s.last_updated);
    if (s.revision) sub += ' · revision ' + s.revision.slice(0, 12);
    return card(pending > 0 ? 'warn' : 'ok', icon, label, embedded + '/' + total + ' (' + p + '%)', sub, true);
  }
  box.innerHTML = one('📚', '知识', d.knowledge || {}) +
    one('🧠', '记忆', d.memory || {}) +
    one('👤', '档案', d.viewer || {});
}
// 费用卡片区分四态：空账本、真实零、全未知、混合；
// 混合账本里 known_cost 只是已知部分，不能标成「累计费用」。
function costCard(d) {
  var total = Number(d.total_calls) || 0;
  var unknown = Number(d.unknown_calls) || 0;
  if (total === 0) return card('info', '💸', '已知费用(¥)', '—', '账本暂无调用');
  if (d.known_cost == null) {
    return card('warn', '💸', '已知费用(¥)', '未知', total + ' 次调用均未计价');
  }
  var known = total - unknown;
  var sub = '已计价 ' + known + '/' + total + ' 次';
  if (unknown > 0) sub += ' · 覆盖率 ' + Math.round(known * 100 / total) + '%';
  // cost_usd 按美元计价；面板显示人民币换算（×7.2），避免主人误读美元符号。
  var cny = Number(d.known_cost) * 7.2;
  return card(unknown > 0 ? 'warn' : 'info', '💸', '已知费用(¥)', cny.toFixed(2), sub);
}
async function loadStatus() {
  var r = await fetch('/api/status');
  if (!r.ok) { document.getElementById('run-cards').innerHTML = '<div class="card bad">加载失败</div>'; return; }
  var d = await r.json();

  var pending = d.events_pending || 0;
  var failed = d.send_failed || 0;
  document.getElementById('run-cards').innerHTML = [
    card('info', '📨', '事件总数', d.events_total || 0),
    card(pending > 0 ? 'warn' : 'ok', '⏳', '待处理', pending),
    card('info', '📤', '发送总数', d.send_total || 0),
    card(failed > 0 ? 'bad' : 'ok', '❌', '发送失败', failed)
  ].join('');

  var kinds = Object.keys(d.memory_by_kind || {}).map(function (k) {
    return k + ' ' + d.memory_by_kind[k];
  }).join(' · ') || '暂无';
  document.getElementById('data-cards').innerHTML = [
    card('info', '🧠', '记忆条数', d.memory_total || 0),
    card('info', '🏷️', '记忆分类', kinds, '', true),
    costCard(d)
  ].join('');

  var health = document.getElementById('health');
  if (failed > 0 || pending > 10) {
    health.className = 'pill bad';
    health.textContent = '异常';
  } else {
    health.className = 'pill ok';
    health.textContent = '正常';
  }
}
async function loadEvents() {
  var d = await (await fetch('/api/events?limit=10')).json();
  document.getElementById('ev-count').textContent = (d.count || 0) + ' 条';
  var box = document.getElementById('events');
  if (!d.items || !d.items.length) { box.innerHTML = '<div class="empty">暂无事件</div>'; return; }
  box.innerHTML = d.items.map(function (e) {
    return '<div class="row"><span class="t">' + hhmmss(e.at) + '</span>' +
      '<span class="who">' + esc(e.from_name || e.channel) + '</span>' +
      '<span class="txt">' + esc(e.text) + '</span>' +
      '<span class="st">' + esc(e.dir) + '</span></div>';
  }).join('');
}
async function loadErrors() {
  var d = await (await fetch('/api/errors?limit=10')).json();
  var items = d.items || [];
  var box = document.getElementById('errors');
  var count = document.getElementById('err-count');
  if (!items.length) {
    count.textContent = '0 条';
    box.innerHTML = '<div class="empty">没有异常，稳 🎉</div>';
    return;
  }
  var dead = items.filter(function (e) { return e.status === 'dead'; });
  var retry = items.filter(function (e) { return e.status !== 'dead'; });
  count.textContent = '共 ' + items.length + ' 条' +
    (dead.length ? ' · dead ' + dead.length : '') + (retry.length ? ' · retry ' + retry.length : '');
  function errRow(e) {
    return '<div class="row err"><span class="t">' + hhmmss(e.at) + '</span>' +
      '<span class="st ' + (e.status === 'dead' ? 'dead' : 'retry') + '">' + esc(e.status) + '</span>' +
      '<span class="who">' + esc(e.from_name || e.channel) + '</span>' +
      '<span class="txt">' + esc(e.text) + '</span>' +
      '<button onclick="clearError(\'' + esc(e.id) + '\')">清理</button></div>';
  }
  function section(title, hint, list) {
    if (!list.length) return '';
    return '<div class="err-group">' + esc(title) + ' · ' + list.length + ' 条' +
      ' <span class="muted">' + esc(hint) + '</span></div>' + list.map(errRow).join('');
  }
  // 分组只影响展示：dead 已停止自动重试，retry 仍会按退避继续。
  box.innerHTML = section('需人工处理（dead）', '自动重试已停止，修好后可重新入队', dead) +
    section('自动重试中（retry）', '程序会按退避继续重试', retry);
}
async function clearError(id) {
  if (!confirm('确认清理这条异常？只影响面板列表，不改事件状态。')) return;
  var r = await fetch('/api/errors/' + encodeURIComponent(id) + '?confirm=yes', {
    method: 'DELETE', headers: { 'X-Panel-Token': panelToken() }
  });
  if (!r.ok) { var e = await r.json(); alert(e.error || '清理失败'); return; }
  loadErrors();
}
async function clearOldErrors() {
  if (!confirm('确认清理 7 天前的 dead/retry 异常？只影响面板列表，不改事件状态。')) return;
  var r = await fetch('/api/errors/clear?confirm=yes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Panel-Token': panelToken() },
    body: JSON.stringify({ days: 7 })
  });
  var d = await r.json();
  if (!r.ok) { alert(d.error || '清理失败'); return; }
  alert('已清理 ' + (d.cleared || 0) + ' 条');
  loadErrors();
}
var injections = [];
var editingInjection = 0;
function injectMsg(text) {
  document.getElementById('inj-msg').textContent = text || '';
}
async function loadInjections() {
  var box = document.getElementById('inj-list');
  var count = document.getElementById('inj-count');
  var r = await fetch('/api/inject');
  if (!r.ok) { box.innerHTML = '<div class="empty">注入功能未启用</div>'; count.textContent = ''; return; }
  var d = await r.json();
  injections = d.items || [];
  if (!injections.length) {
    count.textContent = '0 条';
    box.innerHTML = '<div class="empty">当前没有注入；写一条会在下一次回复生效</div>';
    return;
  }
  var permanent = injections.filter(function (x) { return x.permanent; });
  var timed = injections.filter(function (x) { return !x.permanent; });
  count.textContent = '共 ' + injections.length + ' 条' +
    (permanent.length ? ' · 永久 ' + permanent.length : '') + (timed.length ? ' · 临时 ' + timed.length : '');
  function injItem(x) {
    var exp = x.permanent ? '永久有效' : ('到期 ' + when(x.expires_at));
    return '<div class="inj-item"><div class="txt">' + esc(x.content) + '</div>' +
      '<div class="meta"><span>' + esc(exp) + '</span><span class="spacer"></span>' +
      '<button onclick="injectEdit(' + x.id + ')">编辑</button>' +
      '<button onclick="injectDelete(' + x.id + ')">删除</button></div></div>';
  }
  function section(title, hint, list) {
    if (!list.length) return '';
    return '<div class="inj-group">' + esc(title) + ' · ' + list.length + ' 条' +
      ' <span class="muted">' + esc(hint) + '</span></div>' + list.map(injItem).join('');
  }
  box.innerHTML = section('永久设定', '一直生效，直到手动删除', permanent) +
    section('临时设定', '到期后自动失效', timed);
}
function injectEdit(id) {
  var item = injections.filter(function (x) { return x.id === id; })[0];
  if (!item) return;
  editingInjection = id;
  document.getElementById('inj-content').value = item.content;
  document.getElementById('inj-submit').textContent = '保存';
  document.getElementById('inj-cancel').style.display = '';
  var ttl = item.permanent ? '0' : (item.remaining_seconds > 21600 ? '86400' : (item.remaining_seconds > 3600 ? '21600' : '3600'));
  document.getElementById('inj-ttl').value = ttl;
  injectMsg('正在编辑 #' + id);
}
function injectReset() {
  editingInjection = 0;
  document.getElementById('inj-content').value = '';
  document.getElementById('inj-submit').textContent = '注入';
  document.getElementById('inj-cancel').style.display = 'none';
  injectMsg('');
}
async function injectSubmit() {
  var content = document.getElementById('inj-content').value.trim();
  if (!content) { injectMsg('内容不能为空'); return; }
  var ttl = parseInt(document.getElementById('inj-ttl').value, 10);
  var method = editingInjection ? 'PUT' : 'POST';
  var url = editingInjection ? ('/api/inject/' + editingInjection) : '/api/inject';
  var r = await fetch(url + '?confirm=yes', {
    method: method,
    headers: { 'Content-Type': 'application/json', 'X-Panel-Token': panelToken() },
    body: JSON.stringify({ content: content, ttl_seconds: ttl })
  });
  var d = await r.json();
  if (!r.ok) { injectMsg(d.error || '提交失败'); return; }
  injectReset();
  loadInjections();
}
async function injectDelete(id) {
  if (!confirm('确认删除这条注入？')) return;
  var r = await fetch('/api/inject/' + id + '?confirm=yes', {
    method: 'DELETE',
    headers: { 'X-Panel-Token': panelToken() }
  });
  if (!r.ok) { var e = await r.json(); injectMsg(e.error || '删除失败'); return; }
  if (editingInjection === id) injectReset();
  loadInjections();
}
function load() { loadStatus(); loadEmbeddingStatus(); loadEvents(); loadErrors(); loadInjections(); }
load();
setInterval(load, 15000);
</script>
</body>
</html>
