<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="panel-token" content="__PANEL_TOKEN__">
<title>记忆 · 大肥鱼面板</title>
<style>
:root{--bg:#0f1115;--fg:#e6e6e6;--muted:#8b93a1;--card:#171a21;--line:#232833;--accent:#4ea1ff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:15px}
nav a{color:var(--muted);text-decoration:none;margin-right:14px}
nav a.on{color:var(--accent)}
main{padding:20px;max-width:1080px;margin:0 auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
input,select,button{background:#12151c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}
button.danger{color:var(--bad);border-color:#3a2a2a}
.bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.muted{color:var(--muted)}
.tag{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 6px;display:flex;gap:10px;align-items:center}
.card .bar{margin:8px 0 0}
.empty{padding:18px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <b>🐟 大肥鱼面板</b>
  <nav><a href="/">概览</a><a href="/live">直播</a><a href="/message">消息</a><a href="/activity">活动</a><a href="/config">配置</a><a href="/logs">日志</a><a href="/diary">日报</a><a class="on" href="/memory">记忆</a><a href="/knowledge">知识</a><a href="/accounts">账号</a></nav>
</header>
<main>
  <section class="card" id="vs-card">
    <h2>观众侧写 <span id="vs-status" class="tag">读取中…</span></h2>
    <div class="muted" id="vs-meta">—</div>
    <div class="muted" id="vs-last">—</div>
    <div class="bar">
      <button id="vs-pause" onclick="vsPause(true)">暂停</button>
      <button id="vs-resume" onclick="vsPause(false)">恢复</button>
      <input id="vs-limit" type="number" min="1" max="500" value="50" title="本次回填人数" style="width:80px">
      <button id="vs-backfill" onclick="vsBackfill()">回填</button>
      <input id="vs-uid" placeholder="观众 UID" size="18">
      <button onclick="vsAction('rebuild')">重建</button>
      <button class="danger" onclick="vsAction('revoke')">撤回</button>
    </div>
  </section>
  <div class="bar">
    <input id="q" placeholder="搜索标题/摘要" size="26">
    <select id="kind">
      <option value="">全部类型</option>
      <option value="fact">fact</option>
      <option value="preference">preference</option>
      <option value="promise">promise</option>
      <option value="first_seen">first_seen</option>
    </select>
    <select id="sort" onchange="load()">
      <option value="time">按时间</option>
      <option value="importance">按重要度</option>
    </select>
    <label class="muted"><input id="group" type="checkbox" onchange="load()"> 按类型分组</label>
    <span class="tag">分组只影响排版，不改变排序</span>
    <button onclick="load()">查询</button>
    <span class="muted" id="cnt"></span>
  </div>
  <table>
    <thead><tr><th>类型</th><th>标题</th><th>摘要</th><th>重要度</th><th>时间</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
// 写接口要带面板令牌（O04）：页面 HTML 由服务端注入，跨站页面读不到它。
function panelToken() {
  var m = document.querySelector('meta[name="panel-token"]');
  return m ? m.content : '';
}
function esc(s) {
  return (s || '').replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function memRow(m) {
  return '<tr><td class="tag">' + esc(m.kind) + '</td><td>' + esc(m.title) + '</td>' +
    '<td class="muted">' + esc(m.summary) + '</td><td>' + Number(m.importance).toFixed(2) + '</td>' +
    '<td class="tag">' + esc(m.created_at) + '</td>' +
    '<td><button class="danger" onclick="del(\'' + esc(m.id) + '\')">删除</button></td></tr>';
}
function render(items) {
  var box = document.getElementById('rows');
  if (!items.length) {
    var filtering = document.getElementById('q').value.trim() || document.getElementById('kind').value;
    box.innerHTML = '<tr><td colspan="6" class="empty">' +
      (filtering ? '没有匹配的记忆：清空搜索或类型筛选再试' : '还没有记忆：等提炼跑完再来看看') +
      '</td></tr>';
    return;
  }
  if (!document.getElementById('group').checked) {
    box.innerHTML = items.map(memRow).join('');
    return;
  }
  // 保持后端排序，只把相同类型归到一段；类型顺序按首条出现位置。
  var order = [], groups = {};
  items.forEach(function (m) {
    var k = m.kind || '未分类';
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(m);
  });
  box.innerHTML = order.map(function (k) {
    return '<tr><td colspan="6" class="tag" style="background:#12151c">' + esc(k) + ' · ' + groups[k].length + ' 条</td></tr>' +
      groups[k].map(memRow).join('');
  }).join('');
}
async function load() {
  var q = encodeURIComponent(document.getElementById('q').value);
  var k = encodeURIComponent(document.getElementById('kind').value);
  var s = encodeURIComponent(document.getElementById('sort').value);
  var r = await fetch('/api/memory?q=' + q + '&kind=' + k + '&sort=' + s + '&limit=100');
  var d = await r.json();
  document.getElementById('cnt').textContent = (d.count || 0) + ' 条 · ' +
    (d.sort === 'importance' ? '按重要度' : '按时间');
  render(d.items || []);
}
async function del(id) {
  if (!confirm('确认删除这条记忆？')) return;
  var r = await fetch('/api/memory/' + encodeURIComponent(id) + '?confirm=yes', { method: 'DELETE', headers: { 'X-Panel-Token': panelToken() } });
  if (!r.ok) { var e = await r.json(); alert(e.error || '删除失败'); return; }
  load();
}
function vsStateText(d) {
  if (d.error) return '状态读取失败';
  if (!d.enabled) return '已停用';
  if (d.frozen) return '已冻结（' + esc(d.frozen_reason || '记忆冻结') + '）';
  if (d.paused) return '已暂停';
  if (d.running) return '运行中';
  return '未运行';
}
async function loadViewerSummary() {
  var r = await fetch('/api/viewer/summary');
  var status = document.getElementById('vs-status');
  if (!r.ok) { status.textContent = '未启用'; return; }
  var d = await r.json();
  status.textContent = vsStateText(d);
  var p = d.profiles || {};
  var run = d.last_run || {};
  document.getElementById('vs-meta').textContent =
    '间隔 ' + (d.interval_seconds || 0) + ' 秒 · 已有侧写 ' + (p.summarized || 0) +
    ' 位 · 失败 ' + (p.failed || 0) + ' · fallback ' + (p.fallback || 0) +
    ' · 来源 ' + (p.sources || 0) + ' 条 · 待发布知识 ' + (d.pending_publish || 0) +
    ' · 待清理 ' + (d.pending_purge || 0);
  document.getElementById('vs-last').textContent =
    '最后成功 ' + (d.last_success_at || '暂无') + ' · 最近落库 ' + (p.last_summary_at || '暂无') +
    ' · 最近一轮：候选 ' + (run.candidates || 0) + ' / 成功 ' + (run.summarized || 0) +
    ' / 降级 ' + (run.fallback || 0) + ' / 失败 ' + (run.failed || 0) +
    ' / 让路 ' + (run.busy_skipped || 0) + ' / 预算跳过 ' + (run.budget_skipped || 0) +
    ' · 回填 ' + (d.backfill_running ? '执行中' : (d.backfill_pending ? '排队 ' + d.backfill_pending + ' 人' : '空闲')) +
    (d.last_error ? ' · 错误：' + esc(d.last_error) : '');
  document.getElementById('vs-pause').disabled = !!(d.paused || d.frozen || !d.enabled);
  document.getElementById('vs-resume').disabled = !d.enabled || d.frozen || !d.paused;
  document.getElementById('vs-backfill').disabled = !d.enabled || d.frozen || d.backfill_running || d.backfill_pending > 0;
}
async function vsPost(body) {
  var r = await fetch('/api/viewer/summary?confirm=yes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Panel-Token': panelToken() },
    body: JSON.stringify(body)
  });
  var d = await r.json();
  if (!r.ok) { alert(d.error || '操作失败'); return false; }
  return true;
}
async function vsPause(paused) {
  if (await vsPost({ action: paused ? 'pause' : 'resume' })) loadViewerSummary();
}
async function vsBackfill() {
  var limit = parseInt(document.getElementById('vs-limit').value, 10);
  if (!(limit >= 1 && limit <= 500)) { alert('回填人数需在 1 至 500 之间'); return; }
  if (!confirm('确认对最多 ' + limit + ' 位从未侧写的观众做首次回填？')) return;
  if (await vsPost({ action: 'backfill', limit: limit })) loadViewerSummary();
}
async function vsAction(action) {
  var uid = document.getElementById('vs-uid').value.trim();
  if (!uid) { alert('请先填写观众 UID'); return; }
  if (action === 'revoke' && !confirm('确认撤回该观众侧写？')) return;
  if (await vsPost({ action: action, uid: uid })) loadViewerSummary();
}
load();
loadViewerSummary();
</script>
</body>
</html>
