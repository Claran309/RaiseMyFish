name: CI

# 个人项目：直接 push，不走 PR 流程。
on:
  push:
    branches: [main, dev]

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt 检查
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then echo "以下文件未格式化："; echo "$diff"; exit 1; fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: 测试（含竞态检测）
        run: go test -race -cover ./...

  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: 构建二进制
        run: |
          go build -trimpath -o bin/fishd ./cmd/fishd
          go build -trimpath -o bin/fishctl ./cmd/fishctl

