# golangci-lint v2.15.0；与CI固定版本一致，禁止漂移到latest。
version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - revive
    - bodyclose
    - contextcheck
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign
    - gosec
  settings:
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: indent-error-flow
    gosec:
      excludes:
        - G404
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
